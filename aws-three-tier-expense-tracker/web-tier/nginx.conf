# Web tier: Nginx configuration.
# Replaces /etc/nginx/nginx.conf on the web-tier EC2 instance.
# INTERNAL_ALB_DNS is replaced by scripts/web-setup.sh with the internal ALB's DNS name.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;

    server {
        listen 80 default_server;
        server_name _;

        root  /usr/share/nginx/html/expense;
        index index.html;

        # Health check for the internet-facing ALB target group
        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Shows which web server answered (load balancing demo)
        location = /whoami {
            default_type text/plain;
            return 200 "$hostname\n";
        }

        # Forward API calls to the app tier through the internal ALB.
        # The trailing slash strips the /api prefix: /api/transaction -> /transaction
        location /api/ {
            proxy_pass http://INTERNAL_ALB_DNS:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
